plugins {
    id "net.fabricmc.fabric-loom"
}

version = mod_version
group = mod_group

base {
    archivesName = "$mod_name-$minecraft_version-$project.name"
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : "$mod_id-$project.name",
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

repositories {
    maven { url = "https://maven.fabricmc.net" }
    maven { url = "https://maven.terraformersmc.com/" }
}

dependencies {
    // Game is unobfuscated as of 26.x, so no mappings dependency is needed.
    minecraft "com.mojang:minecraft:$minecraft_version"
    implementation "net.fabricmc:fabric-loader:$fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$fabric_api_version"

    implementation project(":shared")
    implementation project(":tuber")

    // Non-remapping Loom (26.1+) uses plain configurations instead of mod*.
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:$forgeconfigapiport_version"
    implementation "com.terraformersmc:modmenu:21.0.0"

//    compileOnly "mcp.mobius.waila:wthit-api:fabric-12.4.2"
//    runtimeOnly "mcp.mobius.waila:wthit:fabric-12.4.2"
//    runtimeOnly "lol.bai:badpackets:fabric-0.8.1"

    compileOnly "maven.modrinth:jade:${project.jade_version_fabric}"
    runtimeOnly "maven.modrinth:jade:${project.jade_version_fabric}"

//    runtimeOnly "maven.modrinth:sodium:mc1.19.3-0.4.9" // Doesn't wanna work in IntelliJ
//    runtimeOnly "curse.maven:indium-459496:3957480"
//    runtimeOnly "curse.maven:irisshaders-455508:3981799"

//    compileOnly "curse.maven:carry-on-274259:4160654"
//    runtimeOnly "curse.maven:carry-on-274259:4160654"

//    runtimeOnly "curse.maven:terrablender-565956:4647092"
//    runtimeOnly "curse.maven:bclib-495191:4677965"
//    runtimeOnly "curse.maven:betterend-413596:4677967"

//    compileOnly "com.terraformersmc.terraform-api:terraform-wood-api-v1:10.0.0"

}

processResources {
    from project(":shared").sourceSets.main.resources
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand project.properties
    }
}

loom {
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

// Only main compile needs shared/tuber sources. compileTestJava must not get them:
// Jade is compileOnly, so it is absent from testCompileClasspath.
tasks.named("compileJava", JavaCompile).configure {
    source(project(":shared").sourceSets.main.allSource)
    source(project(":tuber").sourceSets.main.allSource)
}
